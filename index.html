<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Scanner PGSD FIT</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://unpkg.com/html5-qrcode"></script>

</head>

<body>

<div class="container">

  <!-- =====================================================
       LOGIN PANITIA
       ===================================================== -->
  <div id="loginPanitia">

    <div class="header">

      <!-- DUA LOGO -->
      <div class="scanner-brand">

        <img
          src="assets/logo-pgsd.png"
          class="scanner-logo logo-left"
          alt="Prodi PGSD"
        >

        <div class="scanner-title">

          <h1>
            SCANNER PGSD FIT
          </h1>

          <p>
            🔐 Akses khusus panitia
          </p>

        </div>

        <img
          src="assets/logo-pgsdfit-2026.png"
          class="scanner-logo logo-right"
          alt="PGSD FIT"
        >

      </div>

    </div>


    <!-- LOGIN PIN -->
    <div class="login-box">

      <h2>
        Verifikasi Panitia
      </h2>

      <p>
        Masukkan PIN untuk membuka scanner absensi.
      </p>

      <input
        type="password"
        id="pinPanitia"
        inputmode="numeric"
        maxlength="10"
        placeholder="Masukkan PIN panitia"
        autocomplete="off"
      >

      <button
        class="btn masuk"
        id="btnMasuk"
        type="button"
        onclick="verifikasiPanitia()"
      >
        🔐 BUKA SCANNER
      </button>

      <div
        id="pesanLogin"
        class="pesan-login"
      ></div>

    </div>

  </div>


  <!-- =====================================================
       SCANNER UTAMA
       ===================================================== -->
  <div
    id="scannerUtama"
    style="display:none;"
  >

    <!-- HEADER SCANNER -->
    <div class="header">

      <div class="scanner-brand">

        <!-- LOGO PRODI PGSD -->
        <img
          src="assets/logo-pgsd.png"
          class="scanner-logo logo-left"
          alt="Prodi PGSD"
        >

        <!-- JUDUL -->
        <div class="scanner-title">

          <h1>
            SCANNER PGSD FIT
          </h1>

          <p>
            Senam Rutin Prodi PGSD
          </p>

        </div>

        <!-- LOGO PGSD FIT -->
        <img
          src="assets/logo-pgsdfit-2026.png"
          class="scanner-logo logo-right"
          alt="PGSD FIT"
        >

      </div>


      <!-- TOMBOL KUNCI -->
      <div style="margin-top:10px;text-align:center;">

        <button
          type="button"
          onclick="kunciScanner()"
          class="btn keluar"
        >
          🔒 Kunci Scanner
        </button>

      </div>

    </div>


    <!-- ===================================================
         PILIH MODE
         =================================================== -->
    <div id="pilihMode">

      <button
        type="button"
        class="btn hadir"
        onclick="pilihMode('HADIR')"
      >
        🟢 SCANNER HADIR
      </button>

      <button
        type="button"
        class="btn terlambat"
        onclick="pilihMode('TERLAMBAT')"
      >
        🟠 SCANNER TERLAMBAT
      </button>

    </div>


    <!-- ===================================================
         AREA SCANNER
         =================================================== -->
    <div
      id="scannerArea"
      style="display:none;"
    >

      <h2 id="judulMode"></h2>

      <div id="reader"></div>

      <div id="hasil">
        📷 Arahkan QR Code ke kamera
      </div>

    </div>

  </div>

</div>


<!-- =====================================================
     POPUP HASIL SCAN
     ===================================================== -->
<div
  id="popup"
  class="popup"
>

  <div id="popupContent"></div>

</div>


<!-- =====================================================
     LOGIN PIN PANITIA
     ===================================================== -->
<script>

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzQvc2HJKWgkX_sHiUodSwbc31wW86wUkkv26Fyfw0h95KqbixA3mKuFMejRbpR2v0s/exec";


function verifikasiPanitia() {

  const pin =
    document
      .getElementById("pinPanitia")
      .value
      .trim();

  const btn =
    document.getElementById("btnMasuk");

  const pesan =
    document.getElementById("pesanLogin");


  if (!pin) {

    pesan.textContent =
      "Masukkan PIN panitia.";

    pesan.className =
      "pesan-login error";

    return;

  }


  btn.disabled = true;

  btn.textContent =
    "Memeriksa...";

  pesan.textContent =
    "";

  pesan.className =
    "pesan-login";


  // ==========================================
  // CALLBACK JSONP
  // ==========================================

  window.pinScannerCallback =
    function(data) {

      btn.disabled = false;

      btn.textContent =
        "🔐 BUKA SCANNER";


      // PIN SALAH
      if (!data || !data.sukses) {

        pesan.textContent =
          (
            data &&
            data.pesan
          )
            ? data.pesan
            : "PIN panitia salah.";

        pesan.className =
          "pesan-login error";

        return;

      }


      // ========================================
      // PIN BENAR
      // ========================================

      document
        .getElementById("loginPanitia")
        .style.display = "none";


      document
        .getElementById("scannerUtama")
        .style.display = "block";


      // Bersihkan pesan
      pesan.textContent =
        "";

      pesan.className =
        "pesan-login";


      // Bersihkan PIN
      document
        .getElementById("pinPanitia")
        .value = "";


      // Hapus script JSONP
      const oldScript =
        document
          .getElementById("pinJsonp");

      if (oldScript) {
        oldScript.remove();
      }

    };


  // ==========================================
  // HAPUS REQUEST LAMA
  // ==========================================

  const oldScript =
    document
      .getElementById("pinJsonp");

  if (oldScript) {
    oldScript.remove();
  }


  // ==========================================
  // REQUEST JSONP
  // ==========================================

  const script =
    document.createElement("script");

  script.id =
    "pinJsonp";


  script.src =
    APPS_SCRIPT_URL +
    "?api=cekPinScanner" +
    "&pin=" +
    encodeURIComponent(pin) +
    "&callback=pinScannerCallback" +
    "&_=" +
    Date.now();


  script.onerror =
    function() {

      btn.disabled = false;

      btn.textContent =
        "🔐 BUKA SCANNER";


      pesan.textContent =
        "Gagal menghubungi server Apps Script.";

      pesan.className =
        "pesan-login error";


      script.remove();

    };


  document
    .body
    .appendChild(script);

}


// ==========================================
// KUNCI SCANNER
// ==========================================

function kunciScanner() {

  document
    .getElementById("scannerUtama")
    .style.display = "none";


  document
    .getElementById("loginPanitia")
    .style.display = "block";


  document
    .getElementById("pinPanitia")
    .value = "";


  document
    .getElementById("pesanLogin")
    .textContent = "";

}

</script>


<!-- =====================================================
     APP SCANNER LAMA
     ===================================================== -->
<script src="app.js"></script>


</body>
</html>
