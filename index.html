<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanner PGSD FIT</title>

<link rel="stylesheet" href="style.css">

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

</head>

<body>

<div class="container">

    <img src="assets/logo.png" width="90">

    <h1>📷 Scanner PGSD FIT</h1>

    <div id="pilihMode">

        <h2>Pilih Mode Scanner</h2>

        <button onclick="pilihMode('HADIR')" class="hadir">
            🟢 SCANNER HADIR
        </button>

        <button onclick="pilihMode('TERLAMBAT')" class="terlambat">
            🟠 SCANNER TERLAMBAT
        </button>

    </div>

    <div id="scannerArea" style="display:none;">

        <h2 id="judulMode"></h2>

        <div id="reader"></div>

        <div id="hasil">
            Arahkan QR ke kamera
        </div>

    </div>

</div>

<script src="app.js"></script>

</body>

</html>
