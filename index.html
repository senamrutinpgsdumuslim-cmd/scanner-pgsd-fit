<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scanner PGSD FIT</title>

<link rel="stylesheet" href="style.css">

<script src="https://unpkg.com/html5-qrcode"></script>

</head>

<body>

<div class="container">

    <img src="assets/logo.png" class="logo">

    <h1>SCANNER PGSD FIT</h1>

    <!-- ========================= -->
    <!-- PILIH MODE -->
    <!-- ========================= -->

    <div id="pilihMode">

        <h2>Pilih Mode Scanner</h2>

        <button class="btn-hadir"
                onclick="pilihMode('HADIR')">

            🟢 SCANNER HADIR

        </button>

        <button class="btn-terlambat"
                onclick="pilihMode('TERLAMBAT')">

            🟠 SCANNER TERLAMBAT

        </button>

    </div>

    <!-- ========================= -->
    <!-- SCANNER -->
    <!-- ========================= -->

    <div id="scannerArea" style="display:none;">

        <h2 id="judulMode"></h2>

        <div id="reader"></div>

        <div id="hasil" class="info-scanner">

            📷 Arahkan QR Code ke Kamera

        </div>

    </div>

</div>

<!-- ===================================== -->
<!-- POPUP VERIFIKASI -->
<!-- ===================================== -->

<div id="popup" class="popup">

    <div id="popupContent"></div>

</div>

<script src="app.js"></script>

</body>

</html>
