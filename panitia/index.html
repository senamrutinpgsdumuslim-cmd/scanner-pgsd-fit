<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Raker Panitia Senam Rutin Prodi PGSD</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e3a5f);
  color: white;
  min-height: 100vh;
}

.container {
  width: 94%;
  max-width: 1200px;
  margin: auto;
  padding: 25px 0 50px;
}

.header {
  text-align: center;
  margin-bottom: 25px;
}

.header h1 {
  margin: 0;
  font-size: 32px;
}

.header p {
  margin-top: 8px;
  opacity: .8;
}

.card {
  background: rgba(255,255,255,.08);
  border-radius: 20px;
  padding: 25px;
  margin-bottom: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,.2);
}

.status {
  text-align: center;
  padding: 12px;
  border-radius: 12px;
  background: rgba(0,0,0,.2);
  margin-bottom: 20px;
}

.roulette {
  background: #16263a;
  border-radius: 20px;
  min-height: 170px;

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;
  padding: 20px;

  font-size: 42px;
  font-weight: bold;

  border: 3px solid rgba(255,255,255,.1);
}

.angkatan {
  display: block;
  font-size: 18px;
  margin-top: 12px;
  color: #7dd3fc;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 20px;
}

button {
  border: none;
  border-radius: 12px;
  padding: 14px 24px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

button:hover {
  transform: translateY(-2px);
}

.btn-start {
  background: #22c55e;
  color: white;
}

.btn-stop {
  background: #ef4444;
  color: white;
}

.btn-lock {
  background: #f59e0b;
  color: #111827;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
  transform: none;
}

.team-wrap {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.team {
  background: rgba(255,255,255,.12);
  border-radius: 18px;
  padding: 20px;
}

.team h2 {
  margin-top: 0;
}

.person {
  background: rgba(255,255,255,.1);
  border-radius: 12px;
  padding: 13px;
  margin: 8px 0;
}

.person strong {
  display: block;
}

.person small {
  color: #a7f3d0;
}

.fixed-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 12px;
}

.fixed-person {
  background: rgba(255,255,255,.08);
  border-radius: 12px;
  padding: 15px;
}

.locked {
  color: #86efac;
  font-weight: bold;
  text-align: center;
  margin-top: 15px;
}

.warning {
  color: #fbbf24;
  text-align: center;
}

@media(max-width:800px) {
  .team-wrap {
    grid-template-columns: 1fr;
  }

  .fixed-grid {
    grid-template-columns: 1fr;
  }

  .roulette {
    font-size: 28px;
  }

  .header h1 {
    font-size: 25px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🎲 RAKER PANITIA</h1>
    <p>Senam Rutin Prodi PGSD</p>
  </div>


  <!-- PERTEMUAN -->
  <div class="card">

    <div class="status" id="statusPertemuan">
      ⏳ Memuat pertemuan...
    </div>

  </div>


  <!-- PANITIA TETAP -->
  <div class="card">

    <h2>👑 PANITIA TETAP</h2>

    <div class="fixed-grid" id="panitiaTetap">
      Memuat...
    </div>

  </div>


  <!-- PENGUNDIAN -->
  <div class="card">

    <h2>🎰 PEMBAGIAN TEAM RAKER</h2>

    <p class="warning" id="infoGiliran">
      Giliran pertama → TEAM A
    </p>

    <div class="roulette">

      <div>

        <div id="namaBerputar">
          SIAP DIUNDI
        </div>

        <span class="angkatan" id="angkatanBerputar"></span>

      </div>

    </div>


    <div class="buttons">

      <button
        class="btn-start"
        id="btnMulai"
        onclick="mulaiUndi()"
      >
        🎲 MULAI UNDI
      </button>


      <button
        class="btn-stop"
        id="btnStop"
        onclick="berhentiUndi()"
        disabled
      >
        🛑 BERHENTI
      </button>


      <button
        class="btn-lock"
        id="btnLock"
        onclick="kunciTeam()"
        disabled
      >
        🔒 KUNCI TEAM
      </button>

    </div>


    <div id="statusUndian" class="locked"></div>

  </div>


  <!-- HASIL TEAM -->
  <div class="team-wrap">

    <div class="team">

      <h2>🅰️ TEAM A</h2>

      <div id="teamA">
        Belum ada anggota.
      </div>

    </div>


    <div class="team">

      <h2>🅱️ TEAM B</h2>

      <div id="teamB">
        Belum ada anggota.
      </div>

    </div>

  </div>

</div>


<script>

/* =========================================================
   KONFIGURASI
========================================================= */

const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbwKRqPMwr-zvEeEcErIS0adxETCsYxO7FgnNV6PDib8KLL-qlek5TrT9wFt4RhcTTcm/exec";

/* =========================================================
   VARIABEL
========================================================= */

let semuaRaker = [];

let poolUndian = [];

let teamA = [];
let teamB = [];

let sedangBerputar = false;

let timerRoulette = null;

let indexNama = 0;

let giliran = "A";

let pertemuanAktif = "";

let hasilTerkunci = false;


/* =========================================================
   LOAD AWAL
========================================================= */

window.onload = function() {

  muatData();

};


/* =========================================================
   AMBIL DATA APPS SCRIPT
========================================================= */

async function muatData() {

  try {

    const response = await fetch(
      URL_APPS_SCRIPT + "?page=api"
    );

    const data = await response.json();

    if (!data.sukses) {

      throw new Error(
        "Data gagal dimuat."
      );

    }


    prosesData(data);

  }

  catch(error) {

    console.error(error);

    document.getElementById(
      "statusPertemuan"
    ).innerHTML =
      "❌ Gagal terhubung ke Apps Script.";

  }

}


/* =========================================================
   PROSES DATA
========================================================= */

function prosesData(data) {

  const panitia =
    data.panitia || [];

  const raker =
    data.raker || [];


  /* -----------------------------
     PANITIA
  ----------------------------- */

  if (panitia.length > 1) {

    const header = panitia[0];

    const idxID =
      header.indexOf("ID");

    const idxNama =
      header.indexOf("NAMA");

    const idxAngkatan =
      header.indexOf("ANGKATAN");

    const idxJenis =
      header.indexOf("JENIS");

    const idxTugas =
      header.indexOf("TUGAS TETAP");

    const idxAktif =
      header.indexOf("AKTIF");


    semuaRaker = [];


    for (let i = 1; i < panitia.length; i++) {

      const row = panitia[i];

      const aktif =
        String(row[idxAktif] || "")
          .trim()
          .toUpperCase();

      const jenis =
        String(row[idxJenis] || "")
          .trim()
          .toUpperCase();


      if (
        aktif === "YA" &&
        jenis === "RAKER"
      ) {

        semuaRaker.push({

          id:
            row[idxID],

          nama:
            row[idxNama],

          angkatan:
            row[idxAngkatan],

          tugasTetap:
            row[idxTugas]

        });

      }

    }


    tampilkanPanitiaTetap(
      panitia
    );

  }


  /* -----------------------------
     RAKER
  ----------------------------- */

  prosesPertemuan(
    raker
  );


  /* -----------------------------
     SIAPKAN POOL
  ----------------------------- */

  poolUndian =
    [...semuaRaker];


  tampilkanTeam();

}


/* =========================================================
   PERTEMUAN AKTIF
========================================================= */

function prosesPertemuan(raker) {

  if (
    !raker ||
    raker.length < 2
  ) {

    document.getElementById(
      "statusPertemuan"
    ).innerHTML =
      "⚠️ Belum ada data RAKER.";

    return;

  }


  const header =
    raker[0];


  const idxPertemuan =
    header.indexOf("PERTEMUAN");

  const idxTanggal =
    header.indexOf("TANGGAL");

  const idxStatus =
    header.indexOf("STATUS");

  const idxTim =
    header.indexOf(
      "TIM INSTRUKTUR"
    );


  let ditemukan = null;


  for (
    let i = 1;
    i < raker.length;
    i++
  ) {

    const row =
      raker[i];


    const status =
      String(
        row[idxStatus] || ""
      )
      .trim()
      .toUpperCase();


    if (
      status === "DRAFT" ||
      status === "BERLANGSUNG"
    ) {

      ditemukan = {

        pertemuan:
          row[idxPertemuan],

        tanggal:
          row[idxTanggal],

        status:
          row[idxStatus],

        tim:
          row[idxTim]

      };

      break;

    }

  }


  if (!ditemukan) {

    document.getElementById(
      "statusPertemuan"
    ).innerHTML =
      "⚠️ Tidak ada pertemuan DRAFT/BERLANGSUNG.";

    return;

  }


  pertemuanAktif =
    ditemukan.pertemuan;


  document.getElementById(
    "statusPertemuan"
  ).innerHTML =

    "📌 PERTEMUAN <b>P" +
    escapeHtml(
      ditemukan.pertemuan
    ) +
    "</b> &nbsp; | &nbsp; " +

    "STATUS: <b>" +
    escapeHtml(
      ditemukan.status
    ) +
    "</b> &nbsp; | &nbsp; " +

    "🔥 TIM INSTRUKTUR: <b>TEAM " +
    escapeHtml(
      ditemukan.tim
    ) +
    "</b>";

}


/* =========================================================
   PANITIA TETAP
========================================================= */

function tampilkanPanitiaTetap(
  panitia
) {

  const box =
    document.getElementById(
      "panitiaTetap"
    );


  const header =
    panitia[0];


  const idxNama =
    header.indexOf("NAMA");

  const idxJenis =
    header.indexOf("JENIS");

  const idxTugas =
    header.indexOf(
      "TUGAS TETAP"
    );

  const idxAktif =
    header.indexOf("AKTIF");


  box.innerHTML = "";


  for (
    let i = 1;
    i < panitia.length;
    i++
  ) {

    const row =
      panitia[i];


    const aktif =
      String(
        row[idxAktif] || ""
      )
      .trim()
      .toUpperCase();


    const jenis =
      String(
        row[idxJenis] || ""
      )
      .trim()
      .toUpperCase();


    if (
      aktif !== "YA" ||
      jenis !== "TETAP"
    ) continue;


    const nama =
      row[idxNama] || "";


    const tugas =
      row[idxTugas] || "-";


    const div =
      document.createElement(
        "div"
      );


    div.className =
      "fixed-person";


    div.innerHTML =

      "<strong>" +
      escapeHtml(nama) +
      "</strong>" +

      "<small>" +
      escapeHtml(tugas) +
      "</small>";


    box.appendChild(div);

  }

}


/* =========================================================
   MULAI UNDI
========================================================= */

function mulaiUndi() {

  if (hasilTerkunci) {

    alert(
      "Team sudah dikunci. Tidak bisa diundi lagi."
    );

    return;

  }


  if (sedangBerputar) {

    return;

  }


  if (poolUndian.length === 0) {

    return;

  }


  sedangBerputar = true;


  document.getElementById(
    "btnMulai"
  ).disabled = true;


  document.getElementById(
    "btnStop"
  ).disabled = false;


  indexNama = 0;


  timerRoulette =
    setInterval(

      function() {

        if (
          poolUndian.length === 0
        ) return;


        const orang =
          poolUndian[
            indexNama %
            poolUndian.length
          ];


        tampilkanNama(
          orang
        );


        indexNama++;

      },

      70

    );

}


/* =========================================================
   BERHENTI
========================================================= */

function berhentiUndi() {

  if (!sedangBerputar) {

    return;

  }


  clearInterval(
    timerRoulette
  );


  sedangBerputar = false;


  document.getElementById(
    "btnStop"
  ).disabled = true;


  /*
    PILIH RANDOM DARI POOL
    SAAT TOMBOL BERHENTI
  */

  const posisi =
    Math.floor(
      Math.random() *
      poolUndian.length
    );


  const terpilih =
    poolUndian[
      posisi
    ];


  /*
    HAPUS DARI POOL
  */

  poolUndian.splice(
    posisi,
    1
  );


  /*
    MASUK TIM
  */

  if (giliran === "A") {

    teamA.push(
      terpilih
    );

    giliran = "B";

  }

  else {

    teamB.push(
      terpilih
    );

    giliran = "A";

  }


  tampilkanNama(
    terpilih
  );


  tampilkanTeam();


  /*
    CEK SELESAI
  */

  if (
    teamA.length === 7 &&
    teamB.length === 6
  ) {

    document.getElementById(
      "btnMulai"
    ).disabled = true;


    document.getElementById(
      "btnLock"
    ).disabled = false;


    document.getElementById(
      "infoGiliran"
    ).innerHTML =
      "🎉 PEMBAGIAN TEAM SELESAI!";


    document.getElementById(
      "statusUndian"
    ).innerHTML =
      "Semua 13 orang sudah masuk Team A/B. Silakan KUNCI TEAM.";

    return;

  }


  /*
    GANTI GILIRAN
  */

  document.getElementById(
    "infoGiliran"
  ).innerHTML =

    "Giliran berikutnya → <b>TEAM " +
    giliran +
    "</b>";


  document.getElementById(
    "btnMulai"
  ).disabled = false;

}


/* =========================================================
   TAMPILKAN NAMA
========================================================= */

function tampilkanNama(
  orang
) {

  document.getElementById(
    "namaBerputar"
  ).textContent =
    orang.nama || "-";


  document.getElementById(
    "angkatanBerputar"
  ).textContent =

    orang.angkatan
      ? "Angkatan " +
        orang.angkatan
      : "";

}


/* =========================================================
   TAMPILKAN TEAM
========================================================= */

function tampilkanTeam() {

  const boxA =
    document.getElementById(
      "teamA"
    );


  const boxB =
    document.getElementById(
      "teamB"
    );


  boxA.innerHTML = "";

  boxB.innerHTML = "";


  if (teamA.length === 0) {

    boxA.innerHTML =
      "Belum ada anggota.";

  }

  else {

    teamA.forEach(
      function(orang, index) {

        boxA.appendChild(
          buatOrang(
            orang,
            index + 1
          )
        );

      }
    );

  }


  if (teamB.length === 0) {

    boxB.innerHTML =
      "Belum ada anggota.";

  }

  else {

    teamB.forEach(
      function(orang, index) {

        boxB.appendChild(
          buatOrang(
            orang,
            index + 1
          )
        );

      }
    );

  }

}


/* =========================================================
   BUAT KARTU ORANG
========================================================= */

function buatOrang(
  orang,
  nomor
) {

  const div =
    document.createElement(
      "div"
    );


  div.className =
    "person";


  div.innerHTML =

    "<strong>" +
    nomor +
    ". " +
    escapeHtml(
      orang.nama
    ) +
    "</strong>" +

    "<small>" +
    escapeHtml(
      orang.angkatan || ""
    ) +
    "</small>";


  return div;

}


/* =========================================================
   KUNCI TEAM
========================================================= */

function kunciTeam() {

  if (
    teamA.length !== 7 ||
    teamB.length !== 6
  ) {

    alert(
      "Team belum lengkap."
    );

    return;

  }


  const yakin =
    confirm(

      "🔒 KUNCI TEAM?\n\n" +

      "Team A: 7 orang\n" +
      "Team B: 6 orang\n\n" +

      "Setelah dikunci, pembagian tidak boleh diacak ulang."

    );


  if (!yakin) {

    return;

  }


  hasilTerkunci = true;


  document.getElementById(
    "btnLock"
  ).disabled = true;


  document.getElementById(
    "btnMulai"
  ).disabled = true;


  document.getElementById(
    "btnStop"
  ).disabled = true;


  document.getElementById(
    "statusUndian"
  ).innerHTML =

    "🔒 TEAM A & TEAM B TERKUNCI.";

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
  text
) {

  return String(
    text ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}

</script>

</body>
</html>
